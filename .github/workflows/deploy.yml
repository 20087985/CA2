name: Automated Cloud Production Deployment

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Automated Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Backend Unit & Integration Tests
        working-directory: backend
        run: |
          python3 -m unittest test_server.py

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fresh repository source array
        uses: actions/checkout@v4

      - name: Execute Remote SSH Pull Commands on Google Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 34.105.141.153
          username: github-actions-deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/html
            git fetch origin main
            git reset --hard origin/main