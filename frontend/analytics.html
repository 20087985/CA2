<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bread 41 - Kitchen Analytics</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="appContainer" style="display: none;">
        <header>
            <h1>🥐 Bread 41 Operations</h1>
            <p>Real Bread Expiry Logs & Sustainability Monitor | Baker: <span id="currentStaffLabel">Staff</span> | <a href="#" onclick="logout()" style="color: #ffcdd2;">Logout</a></p>
        </header>

        <main>
            <div class="navbar">
                <a href="index.html">📋 Active Inventory</a>
                <a href="waste.html">📊 Waste Reporting</a>
                <a href="analytics.html" class="active">💡 Kitchen Analytics</a>
            </div>

            <div class="tab-content active-content">
                <section class="card">
                    <h2>Bakery Sustainability Metrics</h2>
                    <div class="analytics-container">
                        <div class="analytics-box fresh-box"><h3 id="countFresh">0</h3><p>Active Batches</p></div>
                        <div class="analytics-box waste-box"><h3 id="countWaste">0</h3><p>Wasted / Expired Batches</p></div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
