
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshTrack: Bakery Expiry Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>FreshTrack Bakery Dashboard</h1>
        <p>Real-Time Batch Expiry & Shelf-Life Management</p>
    </header>

    <main>
        <section class="card">
            <h2>Log New Production Batch / Raw Stock</h2>
            <form id="bakeryForm">
                <div class="form-group">
                    <input type="text" id="itemName" placeholder="Item Name" required>
                </div>
                <div class="form-group">
                    <select id="category" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Baked Goods">Freshly Baked Goods (Bread/Pastries)</option>
                        <option value="Confectionery">Confectionery & Cakes</option>
                        <option value="Dairy & Eggs">Dairy, Cream & Eggs</option>
                        <option value="Dry Ingredients">Dry Ingredients (Yeast/Flour)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="expiryDate">Batch Expiry Date:</label>
                    <input type="date" id="expiryDate" required>
                </div>
                <button type="submit" class="btn">Log Batch</button>
            </form>
        </section>
        <section class="card">
            <h2>Active Expiry Alerts</h2>
            <table>
                <thead>
                    <tr>
                        <th>Batch Item</th>
                        <th>Category</th>
                        <th>Expiry Date</th>
                        <th>Shelf-Life Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    </tbody>
            </table>
        </section>

     
    </main>
</body>
</html>
